<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jinghpaw ga — Learn Jinghpaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1E9DC;
    --paper:#F8F3EA;
    --ink:#221B16;
    --red:#9C2B2B;
    --red-dim:#C3A6A0;
    --jade:#3E6259;
    --brass:#B4863B;
    --line:rgba(34,27,22,0.16);
    --line-strong:rgba(34,27,22,0.3);
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  h1,h2,h3{margin:0 0 8px 0; font-weight:600; letter-spacing:-0.01em;}
  p{margin:0 0 12px 0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit; font-size:16px;}
  .app{display:flex; min-height:100vh;}

  /* ---- Sidebar / nav ---- */
  .rail{
    width:236px; flex:none; background:var(--ink); color:var(--paper);
    padding:22px 0 16px 0; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-brand{padding:0 20px 18px 20px; border-bottom:1px solid rgba(248,243,234,0.14); margin-bottom:6px;}
  .rail-brand .jp{font-family:'Fraunces', serif; font-size:22px; font-weight:600; color:var(--paper); display:block; white-space:nowrap;}
  .rail-brand .en{font-size:12.5px; color:rgba(248,243,234,0.6); display:block; margin-top:2px;}
  .rail-stripe{height:4px; width:100%; background:linear-gradient(90deg, var(--red) 0 33%, var(--paper) 33% 66%, var(--jade) 66% 100%); opacity:0.9;}
  .rail-section-label{font-size:11.5px; color:rgba(248,243,234,0.45); padding:14px 20px 4px 20px;}
  .rail-nav{display:flex; flex-direction:column; padding:0 8px;}
  .rail-btn{
    display:flex; align-items:center; gap:9px; text-align:left; background:none; border:none;
    color:rgba(248,243,234,0.82); padding:9px 12px; border-radius:var(--radius); font-size:14.5px;
  }
  .rail-btn:hover{background:rgba(248,243,234,0.08);}
  .rail-btn.active{background:rgba(248,243,234,0.14); color:#fff; font-weight:600;}
  .rail-btn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.5; flex:none;}
  .rail-btn.active .dot{opacity:1; background:var(--brass);}
  .rail-foot{margin-top:auto; padding:14px 20px 4px 20px; font-size:11.5px; color:rgba(248,243,234,0.4); border-top:1px solid rgba(248,243,234,0.14);}

  /* ---- Mobile top bar ---- */
  .topbar{display:none; align-items:center; justify-content:space-between; background:var(--ink); color:var(--paper); padding:12px 16px;}
  .topbar .jp{font-family:'Fraunces', serif; font-size:19px; font-weight:600;}
  .topbar button{background:none; border:1px solid rgba(248,243,234,0.4); color:var(--paper); padding:6px 10px; border-radius:var(--radius); font-size:13px;}
  .rail-backdrop{display:none;}

  /* ---- Main ---- */
  .main{flex:1; min-width:0; padding:36px 40px 80px 40px;}
  .content{max-width:760px; margin:0 auto;}
  .eyebrow{color:var(--red); font-size:13px; font-weight:600; margin-bottom:6px;}
  .lede{font-size:17px; color:#4a3f36; max-width:60ch;}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .card + .card{margin-top:14px;}
  .divider{height:1px; background:var(--line); margin:26px 0;}
  .stripe-rule{height:3px; width:64px; background:linear-gradient(90deg, var(--red), var(--jade)); margin:18px 0 22px 0; border-radius:2px;}

  /* fact grid on intro */
  .facts{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0 8px 0;}
  .fact{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--paper);}
  .fact .num{font-family:'Fraunces', serif; font-size:26px; font-weight:600; color:var(--red); display:block;}
  .fact .lbl{font-size:13px; color:#5a4d42;}

  .example-sentence{border-left:3px solid var(--jade); padding:6px 0 6px 16px; margin:14px 0;}
  .example-sentence .jp{font-family:'Fraunces', serif; font-size:19px; font-style:italic;}
  .example-sentence .gloss{font-size:13.5px; color:#5a4d42; margin-top:4px;}

  /* ---- Word list ---- */
  .lesson-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .word-list{list-style:none; margin:18px 0 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .word-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border:1px solid var(--line); border-radius:var(--radius); padding:13px 16px; background:var(--paper);
  }
  .word-row .jp{font-family:'Fraunces', serif; font-size:18px; font-weight:600;}
  .word-row .en{font-size:14.5px; color:#4a3f36; margin-top:2px;}
  .word-row .note{font-size:12.5px; color:var(--brass); margin-top:3px; font-style:italic;}
  .word-actions{display:flex; gap:6px; flex:none;}
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:var(--radius); width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; color:#5a4d42; font-size:14px;
  }
  .icon-btn:hover{border-color:var(--line-strong); color:var(--ink);}
  .empty-state{border:1px dashed var(--line-strong); border-radius:var(--radius); padding:26px 20px; text-align:center; color:#5a4d42; margin-top:18px;}
  .empty-state strong{display:block; color:var(--ink); font-family:'Fraunces', serif; font-size:18px; margin-bottom:6px;}

  .btn{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:10px 16px;
    border-radius:var(--radius); font-size:14px; font-weight:600;
  }
  .btn:hover{opacity:0.88;}
  .btn.secondary{background:none; color:var(--ink); border:1px solid var(--line-strong);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.small{padding:7px 12px; font-size:13px;}
  .btn.danger{background:var(--red); border-color:var(--red);}
  .audio-btn{
    border:1px solid var(--line-strong); background:var(--paper); border-radius:var(--radius);
    padding:8px 13px; font-size:13.5px; color:var(--ink); display:inline-flex; align-items:center; gap:7px;
  }
  .audio-btn:hover{border-color:var(--ink);}
  .fs-btn{background:none; border:1px solid rgba(248,243,234,0.4); color:var(--paper); border-radius:var(--radius); width:32px; height:32px; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none;}
  .fs-btn:hover{background:rgba(248,243,234,0.12);}
  .file-hint{font-size:12px; color:#8a7a6c; margin-top:5px;}

  /* ---- Alphabet ---- */
  .letter-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:16px;}
  .letter-card{border:1px solid var(--line); border-radius:var(--radius); padding:14px; background:var(--paper);}
  .letter-card .glyph{font-family:'Fraunces', serif; font-size:24px; font-weight:700; color:var(--red);}
  .letter-card .desc{font-size:13px; color:#5a4d42; margin-top:5px;}
  .letter-card .ex{font-size:12.5px; margin-top:6px; color:var(--jade);}

  /* ---- Practice / quiz picker ---- */
  .quiz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:16px;}
  .quiz-type-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:var(--paper); text-align:left;}
  .quiz-type-card:hover{border-color:var(--line-strong);}
  .quiz-type-card .t{font-family:'Fraunces', serif; font-size:17px; font-weight:600;}
  .quiz-type-card .d{font-size:13px; color:#5a4d42; margin-top:4px;}
  select.lesson-select{
    width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius);
    background:var(--paper); color:var(--ink); font-size:14.5px; margin-top:6px;
  }

  /* ---- Active quiz ---- */
  .quiz-shell{max-width:640px;}
  .quiz-progress{font-size:13px; color:#5a4d42; margin-bottom:10px;}
  .quiz-prompt{font-family:'Fraunces', serif; font-size:15px; color:#5a4d42; margin-bottom:6px;}
  .quiz-word{font-family:'Fraunces', serif; font-size:32px; font-weight:600; margin-bottom:4px;}
  .quiz-note{font-size:13px; color:var(--brass); font-style:italic; margin-bottom:18px;}
  .mc-options{display:flex; flex-direction:column; gap:9px;}
  .mc-opt{
    text-align:left; padding:13px 16px; border:1px solid var(--line-strong); border-radius:var(--radius);
    background:var(--paper); font-size:15px;
  }
  .mc-opt:hover{border-color:var(--ink);}
  .mc-opt.correct{border-color:var(--jade); background:#e7efe9; color:#204036;}
  .mc-opt.wrong{border-color:var(--red); background:#f6e6e6; color:#6e2323;}
  .mc-opt[disabled]{cursor:default;}

  .type-input-row{display:flex; gap:8px; margin-top:6px;}
  .type-input-row input{flex:1; padding:12px 14px; border:1px solid var(--line-strong); border-radius:var(--radius);}
  .type-feedback{margin-top:14px; padding:12px 14px; border-radius:var(--radius); font-size:14.5px;}
  .type-feedback.good{background:#e7efe9; color:#204036; border:1px solid var(--jade);}
  .type-feedback.bad{background:#f6e6e6; color:#6e2323; border:1px solid var(--red);}

  .flash-card{
    border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--paper);
    min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:26px; cursor:pointer; flex-direction:column;
  }
  .flash-card .main-txt{font-family:'Fraunces', serif; font-size:28px; font-weight:600;}
  .flash-card .sub-txt{font-size:14px; color:#5a4d42; margin-top:8px;}
  .flash-card .hint{font-size:12px; color:var(--brass); margin-top:14px;}
  .flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}

  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:16px;}
  .match-col{display:flex; flex-direction:column; gap:8px;}
  .match-item{
    border:1px solid var(--line-strong); border-radius:var(--radius); padding:12px 14px;
    background:var(--paper); font-size:14.5px; text-align:left;
  }
  .match-item.selected{border-color:var(--brass); background:#f2e6cf;}
  .match-item.locked{border-color:var(--jade); background:#e7efe9; color:#204036; opacity:0.75;}
  .match-item.shake{animation:shake 0.32s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .match-item.jp-txt{font-family:'Fraunces', serif; font-weight:600; font-size:16px;}

  .quiz-summary{text-align:center; padding:30px 10px;}
  .quiz-summary .score{font-family:'Fraunces', serif; font-size:44px; font-weight:700; color:var(--red);}

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(34,27,22,0.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{background:var(--paper); border-radius:var(--radius); max-width:420px; width:100%; padding:22px; border:1px solid var(--line-strong);}
  .modal h3{margin-bottom:4px;}
  .modal .field{margin-top:14px;}
  .modal label{display:block; font-size:13px; color:#5a4d42; margin-bottom:5px;}
  .modal input, .modal textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius); background:#fff;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:var(--radius); font-size:13.5px; z-index:60; opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .loading-note{color:#5a4d42; font-size:14px; padding:40px 0;}

  @media (max-width:820px){
    .rail{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .18s ease; z-index:40; width:250px;}
    .rail.open{transform:translateX(0);}
    .rail-backdrop.open{display:block; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:39;}
    .topbar{display:flex; position:sticky; top:0; z-index:20;}
    .main{padding:22px 16px 70px 16px;}
    .facts{grid-template-columns:1fr 1fr;}
    .match-grid{gap:10px;}
  }

  .muted{color:#8a7a6c; font-style:italic;}
  .muted-strong{color:#5a4d42; font-size:14px;}
  .mode-switch{display:flex; gap:6px; padding:12px 12px 2px 12px;}
  .mode-btn{flex:1; background:none; border:1px solid rgba(248,243,234,0.28); color:rgba(248,243,234,0.8); padding:8px 6px; border-radius:var(--radius); font-size:13px; font-weight:600;}
  .mode-btn:hover{border-color:rgba(248,243,234,0.6);}
  .mode-btn.on{background:var(--paper); color:var(--ink); border-color:var(--paper);}
  .rail-link{background:none; border:none; color:rgba(248,243,234,0.8); text-decoration:underline; padding:0; font-size:12.5px; text-align:left;}
  .rail-link.active{color:#fff; font-weight:600;}
  .welcome{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px; background:var(--cream);}
  .welcome-inner{max-width:640px; width:100%; text-align:center;}
  .welcome-brand{font-family:'Fraunces', serif; font-size:44px; font-weight:700; letter-spacing:-0.02em;}
  .welcome-stripe{height:6px; width:120px; margin:14px auto 0; background:linear-gradient(90deg, var(--red) 0 40%, var(--paper) 40% 60%, var(--jade) 60% 100%); border-radius:2px; border:1px solid var(--line);}
  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .choice{background:var(--paper); border:1px solid var(--line-strong); border-radius:var(--radius); padding:28px 18px; text-align:center; display:flex; flex-direction:column; gap:6px; color:var(--ink);}
  .choice:hover{border-color:var(--ink);}
  .choice .c-title{font-family:'Fraunces', serif; font-size:22px; font-weight:600;}
  .choice .c-sub{font-size:13.5px; color:#5a4d42;}
  .tr-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .tr-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line);}
  .tr-en{font-size:14.5px; color:#4a3f36; padding-top:9px;}
  .tr-row input,.tr-row textarea{width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:var(--radius); background:#fff; font-family:inherit; font-size:15px;}
  @media (max-width:820px){ .choice-grid{grid-template-columns:1fr;} .tr-row{grid-template-columns:1fr; gap:6px;} .tr-en{padding-top:0;} }

  .lesson-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .icon-btn.rec{color:var(--red);}
  .rec-row{display:flex; align-items:center; gap:12px; margin:10px 0;}
  .rec-btn{min-width:110px;}
  .rec-btn.live{background:var(--red); border-color:var(--red); color:#fff;}
  .rec-time{font-variant-numeric:tabular-nums; color:var(--red); font-weight:600; font-size:14px;}
  .rec-word{font-family:'Fraunces', serif; font-size:34px; font-weight:600; margin:10px 0 2px 0;}
  .rec-sub{color:#5a4d42; margin-bottom:10px;}
</style>
</head>

<script>
/* Local storage for the desktop app: same interface the app already uses, backed by IndexedDB */
(function(){
  if(window.storage) return;
  var dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res,rej){
      var r = indexedDB.open('jinghpaw',1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t = db.transaction('kv', mode);
        var req = fn(t.objectStore('kv'));
        t.oncomplete = function(){ res(req.result); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }
  window.storage = {
    get:function(k){ return tx('readonly', function(s){ return s.get(k); }).then(function(v){ if(v===undefined) throw new Error('not found'); return {key:k, value:v}; }); },
    set:function(k,v){ return tx('readwrite', function(s){ return s.put(v,k); }).then(function(){ return {key:k, value:v}; }); },
    delete:function(k){ return tx('readwrite', function(s){ return s.delete(k); }).then(function(){ return {key:k, deleted:true}; }); }
  };
})();
</script>

(function(){

/* =====================================================================

var UI = {

/* =====================================================================
   SEED CONTENT
   course: 'both' (default) | 'jp' (only when learning Jinghpaw) | 'en' (only when learning English)
   ===================================================================== */
function W(id, jp, en, note, course){
  var o = {id:id, jp:jp, en:en};
  if(note) o.note = note;
  if(course) o.course = course;
  return o;
}
function EW(id, en, noteEn){
  var o = {id:id, jp:'', en:en};
  if(noteEn) o.noteEn = noteEn;
  return o;
}
function alphaItems(){
  var L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var ex = ['apple','ball','cat','dog','egg','fish','goat','hat','ice','jar','kite','lamp','moon','nest','orange','pen','queen','rain','sun','tree','umbrella','van','water','box','yellow','zebra'];
  return L.map(function(l,i){ return EW('ea_'+l.toLowerCase(), l+' '+l.toLowerCase(), ex[i]); });
}
function seedCategories(){
  return [
    {id:'en-alphabet', course:'en', title:'English Alphabet', blurb:'', items: alphaItems()},
    {
      id:'greetings', title:'Greetings & Everyday Phrases',
      blurb:'Jinghpaw does not really use a word for "hello" — people greet each other with questions instead.',
      items:[

/* Bring older saved content up to date WITHOUT overwriting the user's edits */
function migrate(stored){
  var seed = seedCategories();
  var byId = {};
  stored.forEach(function(c){ byId[c.id] = c; });
  var result = [];
  seed.forEach(function(sc){
    var ex = byId[sc.id];
    if(ex){
      if(!ex.course && sc.course) ex.course = sc.course;
      ex.items.forEach(function(it){
        var si = null;
        sc.items.forEach(function(s){ if(s.id===it.id) si = s; });
        if(si && si.course && !it.course) it.course = si.course;
      });
      result.push(ex);
      delete byId[sc.id];
    } else {
      result.push(sc);
    }
  });
  Object.keys(byId).forEach(function(id){ result.push(byId[id]); });
  result.forEach(function(c){
    if(c.id==='greetings'){
      c.items.forEach(function(it){
        if(it.id==='g1' && it.en==='How are you? (lit. "Is it good?")'){
          it.en = 'How are you?';
          it.note = 'Literally: "Is it good?"';
        }
      });
    }
  });
  return result;
}

   shim included at the top of the page)

var storageAvailable = !!(window.storage && window.storage.get && window.storage.set);

/* Editing tools (add/edit/delete/record/backup) are shown in the desktop app and on localhost.
   On a public website they are hidden for visitors; open the page with ?edit=1 to turn them on
   in your own browser (?edit=0 turns them off again). */
function computeEditor(){
  try{
    var q = location.search || '';
    if(/[?&]edit=0(&|$)/.test(q)){ try{ localStorage.removeItem('jg_editor'); }catch(e){} return false; }
    if(/[?&]edit(=1)?(&|$)/.test(q)){ try{ localStorage.setItem('jg_editor','1'); }catch(e){} return true; }
    if(location.protocol!=='http:' && location.protocol!=='https:') return true;
    if(location.hostname==='localhost' || location.hostname==='127.0.0.1') return true;
    return localStorage.getItem('jg_editor')==='1';
  }catch(e){ return false; }
}
var EDITOR = computeEditor();

function sGet(key, fallback){
  if(!storageAvailable) return Promise.resolve(fallback);
  return window.storage.get(key, false).then(function(res){
    if(res && res.value){ try{ return JSON.parse(res.value); }catch(e){ return fallback; } }
    return fallback;
  }).catch(function(){ return fallback; });
}
function sSet(key, obj){
  if(!storageAvailable) return Promise.resolve(null);
  return window.storage.set(key, JSON.stringify(obj), false).catch(function(){ return null; });
}
function loadContent(){
  if(!storageAvailable) return Promise.resolve(seedCategories());
  return window.storage.get('content', false).then(function(res){
    if(res && res.value){
      try{ return migrate(JSON.parse(res.value)); }catch(e){ return seedCategories(); }
    }
    return 'EMPTY';
  }).catch(function(){ return 'EMPTY'; }).then(function(found){
    if(found!=='EMPTY'){
      if(EDITOR || !storageAvailable) return found;
      /* visitor with saved copy: pick up a newer pack published on the site (visitors cannot edit, so nothing of theirs is lost; progress is stored separately) */
      return fetchStarterPack().then(function(pack){
        if(!pack || !pack.exported) return found;
        return window.storage.get('packStamp', false).then(function(r){ return r && r.value; }).catch(function(){ return null; }).then(function(stamp){
          if(stamp===pack.exported) return found;
          return applyPack(pack).then(function(r){
            starterUi = r.ui;
            return window.storage.set('packStamp', pack.exported, false).catch(function(){})
              .then(function(){ return window.storage.set('content', JSON.stringify(r.categories), false).catch(function(){}); })
              .then(function(){ return r.categories; });
          });
        });
      }).catch(function(){ return found; });
    }
    /* nothing saved yet: use the starter pack shipped next to the app (website), else the built-in lessons */
    return fetchStarterPack().then(function(pack){
      if(pack){
        return applyPack(pack).then(function(r){
          starterUi = r.ui;
          if(pack.exported) window.storage.set('packStamp', pack.exported, false).catch(function(){});
          return window.storage.set('content', JSON.stringify(r.categories), false).then(function(){ return r.categories; }).catch(function(){ return r.categories; });
        });
      }
      var seed = seedCategories();
      return window.storage.set('content', JSON.stringify(seed), false).then(function(){ return seed; }).catch(function(){ return seed; });
    });
  });
}
function saveContent(c){ return sSet('content', c); }
function saveProgress(p){ return sSet('progress', p); }
function saveSettings(){ return sSet('settings', {mode: state.mode}); }
function saveUi(){ return sSet('ui_jp', state.ui); }

function audioKey(id){ return (learningEn() ? 'audioEn_' : 'audio_') + id; }
function setAudio(itemId, dataUrl){
  if(!storageAvailable) return Promise.resolve(null);
  return window.storage.set(audioKey(itemId), dataUrl, false).catch(function(){ return null; });
}
function deleteAudio(itemId){
  if(!storageAvailable) return Promise.resolve(null);
  return window.storage.delete(audioKey(itemId), false).catch(function(){ return null; });
}
function deleteAllAudio(itemId){
  if(!storageAvailable) return Promise.resolve(null);
  return Promise.all([
    window.storage.delete('audio_'+itemId, false).catch(function(){ return null; }),
    window.storage.delete('audioEn_'+itemId, false).catch(function(){ return null; })
  ]);
}
var audioCache = {};
var sharedAudioEl = null;
function getAudioEl(){
  if(!sharedAudioEl){
    sharedAudioEl = document.createElement('audio');
    sharedAudioEl.id = 'sharedAudioPlayer';
    document.body.appendChild(sharedAudioEl);
  }
  return sharedAudioEl;
}
function playSrc(src){
  var el = getAudioEl();
  el.src = src;
  var pr = el.play();
  if(pr && pr.catch) pr.catch(function(){ showToast("Couldn't play that clip."); });
}
function playAudioFor(itemId){
  var key = audioKey(itemId);
  if(audioCache[key]){ playSrc(audioCache[key]); return; }
  if(!storageAvailable){ showToast('Audio storage is not available here.'); return; }
  window.storage.get(key, false).then(function(res){
    if(res && res.value){ audioCache[key] = res.value; playSrc(res.value); }
    else showToast('No audio saved for this word yet.');
  }).catch(function(){ showToast('No audio saved for this word yet.'); });
}
function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function downloadText(name, text){
  var blob = new Blob([text], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

  var s = UI[key];

/* answer checking: ignores case, spacing, end punctuation, "(1)" notes, and "a / b" alternatives */
function norm(s){
  return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
}
function acceptedAnswers(s){
  var full = norm(s);
  var base = norm(String(s).replace(/\([^)]*\)/g,''));
  var list = [full, base];
  base.split('/').forEach(function(a){ var x = norm(a); if(x) list.push(x); });
  return list;
}

function packValid(p){ return !!(p && p.format==='jinghpaw-ga-pack' && Array.isArray(p.content)); }
function buildPack(){
  var keys = [];
  state.categories.forEach(function(c){
    c.items.forEach(function(it){
      if(it.hasAudio) keys.push('audio_'+it.id);
      if(it.hasAudioEn) keys.push('audioEn_'+it.id);
    });
  });
  var reads = keys.map(function(k){
    if(!storageAvailable) return Promise.resolve([k,null]);
    return window.storage.get(k, false).then(function(r){ return [k, r && r.value]; }).catch(function(){ return [k, null]; });
  });
  return Promise.all(reads).then(function(pairs){
    var audio = {};
    pairs.forEach(function(pr){ if(pr[1]) audio[pr[0]] = pr[1]; });
    return {format:'jinghpaw-ga-pack', version:1, exported:new Date().toISOString(), content:state.categories, ui:state.ui, audio:audio};
  });
}
function applyPack(pack){
  var cats = migrate(pack.content);
  var audio = pack.audio || {};
  var writes = [];
  Object.keys(audio).forEach(function(k){
    if(storageAvailable && typeof audio[k]==='string' && /^(audio|audioEn)_/.test(k)){
      writes.push(window.storage.set(k, audio[k], false).catch(function(){ return null; }));
    }
  });
  return Promise.all(writes).then(function(){ return {categories:cats, ui:pack.ui || {}}; });
}

/* =====================================================================
   QUIZ ENGINE
   ===================================================================== */
var quizSession = null;

function startQuiz(type, lessonId){
  var pool;
  if(lessonId==='__all__') pool = allItemsPool();
  else { var c = catById(lessonId); pool = c ? usableItems(c) : []; }
  if(pool.length<3){ showToast(t('toast.needThree')); return; }
  pool = shuffle(pool);
  var n = type==='match' ? Math.min(6,pool.length) : Math.min(8,pool.length);
  quizSession = {type:type, lessonId:lessonId, items:pool.slice(0,n), index:0, score:0, cur:null, matchState:null, _recorded:false};
  if(type==='match') setupMatchRound(); else prepQuestion();
  goTo({name:'quiz'});
}

function prepQuestion(){
  var qs = quizSession;
  if(qs.index >= qs.items.length){ qs.cur = null; return; }
  var item = qs.items[qs.index];
  qs.cur = {answered:false, flipped:false, typeChecked:false, typeCorrect:false};
  if(qs.type==='mc'){
    var askTarget = Math.random() < 0.5;
    var labelOf = function(x){ return askTarget ? nat(x) : tgt(x); };
    var correctLabel = labelOf(item);
    var seen = {}; seen[correctLabel.toLowerCase()] = 1;
    var cand = shuffle(allItemsPool().filter(function(p){ return p.id!==item.id; }));
    var distract = [];
    for(var i=0; i<cand.length && distract.length<3; i++){
      var l = labelOf(cand[i]).toLowerCase();
      if(!seen[l]){ seen[l] = 1; distract.push(cand[i]); }
    }
    qs.cur.askTarget = askTarget;
    qs.cur.correctLabel = correctLabel;
    qs.cur.options = shuffle([item].concat(distract));
  }
}
function advance(){
  quizSession.index += 1;
  prepQuestion();
  goTo({name:'quiz'});
}

function recordProgress(lessonId, type, correct, total){
  if(!state.progress[lessonId]) state.progress[lessonId] = {};
  if(!state.progress[lessonId][type]) state.progress[lessonId][type] = {attempts:0, correct:0, total:0};
  var s = state.progress[lessonId][type];
  s.attempts += 1; s.correct += correct; s.total += total;
  saveProgress(state.progress);
}

function viewQuiz(){
  if(!quizSession) return '<p><button class="btn small" data-action="back-practice">'+esc(t('quiz.back'))+'</button></p>';
  if(quizSession.type==='mc') return renderMC();
  if(quizSession.type==='match') return renderMatch();
  if(quizSession.type==='flash') return renderFlash();
  if(quizSession.type==='type') return renderType();
  return '';
}

  var qs = quizSession;
  return '<div class="eyebrow">'+esc(label)+'</div><div class="quiz-shell"><div class="quiz-progress">'+esc(t('quiz.word'))+' '+(qs.index+1)+' '+esc(t('quiz.of'))+' '+qs.items.length+' &nbsp;·&nbsp; '+esc(t('quiz.score'))+' '+qs.score+'</div>';
}
function audioBtn(item, label){
  return '<button type="button" class="audio-btn" data-action="play-audio" data-item="'+esc(item.id)+'">▶ '+esc(label)+'</button>';
}

function renderMC(){
  var qs = quizSession;
  if(qs.index >= qs.items.length) return quizSummary();
  var item = qs.items[qs.index], c = qs.cur;
  var shown = c.askTarget ? tgt(item) : nat(item);
  var prompt = c.askTarget ? t('quiz.whatMean') : (learningEn() ? t('quiz.howSayEn') : t('quiz.howSayJp'));
  var h = quizHeader(t('qt.mc.title'));
  h += '<div class="quiz-prompt">'+esc(prompt)+'</div>';
  h += '<div class="quiz-word">'+esc(shown)+'</div>';
  if(c.askTarget && !learningEn() && item.note) h += '<div class="quiz-note">'+esc(item.note)+'</div>';
  if(c.askTarget && audioOk(item)) h += '<div style="margin-bottom:14px;">'+audioBtn(item, t('quiz.play'))+'</div>';
  h += '<div class="mc-options">';
  c.options.forEach(function(o,i){
    h += '<button class="mc-opt" data-mc-index="'+i+'">'+esc(c.askTarget ? nat(o) : tgt(o))+'</button>';
  });
  return h + '</div></div>';
}
function handleMC(idx){
  var qs = quizSession, c = qs.cur;
  if(c.answered) return;
  c.answered = true;
  var labelOf = function(x){ return c.askTarget ? nat(x) : tgt(x); };
  var correct = labelOf(c.options[idx]).toLowerCase() === c.correctLabel.toLowerCase();
  if(correct) qs.score += 1;
  Array.prototype.forEach.call(document.querySelectorAll('.mc-opt'), function(btn, i){
    btn.setAttribute('disabled','disabled');
    if(labelOf(c.options[i]).toLowerCase() === c.correctLabel.toLowerCase()) btn.classList.add('correct');
    else if(i===idx) btn.classList.add('wrong');
  });
  setTimeout(advance, 900);
}

function renderType(){
  var qs = quizSession;
  if(qs.index >= qs.items.length) return quizSummary();
  var item = qs.items[qs.index], c = qs.cur;
  var h = quizHeader(t('qt.type.title'));
  h += '<div class="quiz-prompt">'+esc(learningEn() ? t('quiz.typePromptEn') : t('quiz.typePromptJp'))+'</div>';
  h += '<div class="quiz-word">'+esc(nat(item))+'</div>';
  h += '<div class="type-input-row"><input type="text" id="typeInput" autocomplete="off" autocapitalize="none" placeholder="'+esc(t('quiz.placeholder'))+'" '+(c.typeChecked?'disabled':'')+'><button class="btn" id="typeSubmit" '+(c.typeChecked?'disabled':'')+'>'+esc(t('quiz.check'))+'</button></div>';
  if(c.typeChecked){
    h += '<div class="type-feedback '+(c.typeCorrect?'good':'bad')+'">'+(c.typeCorrect ? esc(t('quiz.correct')) : esc(t('quiz.notQuite'))+' "'+esc(tgt(item))+'".')+'</div>';
    if(audioOk(item)) h += '<div style="margin-top:12px;">'+audioBtn(item, t('quiz.hear'))+'</div>';
    h += '<div style="margin-top:16px;"><button class="btn" id="nextBtn">'+esc(t('quiz.next'))+'</button></div>';
  }
  return h + '</div>';
}
function handleTypeSubmit(){
  var qs = quizSession, c = qs.cur;
  if(c.typeChecked) return;
  var input = document.getElementById('typeInput');
  var item = qs.items[qs.index];
  var val = norm(input.value || '');
  var ok = val.length>0 && acceptedAnswers(tgt(item)).indexOf(val) > -1;
  if(ok) qs.score += 1;
  c.typeChecked = true; c.typeCorrect = ok;
  rerender();
}

function renderFlash(){
  var qs = quizSession;
  if(qs.index >= qs.items.length) return quizSummary();
  var item = qs.items[qs.index], c = qs.cur;
  var h = quizHeader(t('qt.flash.title'));

function setupMatchRound(){
  var qs = quizSession;
  var left = qs.items.map(function(it){ return {id:it.id, text:tgt(it), hasAudio:audioOk(it)}; });
  var right = qs.items.map(function(it){ return {id:it.id, text:nat(it)}; });
  qs.matchState = {left:shuffle(left), right:shuffle(right), selectedLeft:null, selectedRight:null, lockedIds:[], wrongFlash:null, attempts:0};
}
function renderMatch(){
  var qs = quizSession, ms = qs.matchState;
  var total = qs.items.length;
  if(ms.lockedIds.length === total) return quizSummary();
  var h = '<div class="eyebrow">'+esc(t('qt.match.title'))+'</div><div class="quiz-shell">';
  h += '<div class="quiz-progress">'+esc(t('quiz.matched'))+' '+ms.lockedIds.length+' '+esc(t('quiz.of'))+' '+total+'</div>';
  h += '<div class="match-grid"><div class="match-col">';
  ms.left.forEach(function(l){
    var locked = ms.lockedIds.indexOf(l.id)>-1;
    var cls = 'match-item jp-txt' + (locked?' locked':(ms.selectedLeft===l.id?' selected':'')) + (ms.wrongFlash && ms.wrongFlash.left===l.id ? ' shake':'');
    h += '<div style="display:flex; align-items:center; gap:6px;">';
    h += '<button class="'+cls+'" style="flex:1;" data-match-left="'+esc(l.id)+'" '+(locked?'disabled':'')+'>'+esc(l.text)+'</button>';
    if(l.hasAudio) h += '<button type="button" class="icon-btn" title="Play" data-action="play-audio" data-item="'+esc(l.id)+'">▶</button>';
    h += '</div>';
  });
  h += '</div><div class="match-col">';
  ms.right.forEach(function(r){
    var locked = ms.lockedIds.indexOf(r.id)>-1;
    var cls = 'match-item' + (locked?' locked':(ms.selectedRight===r.id?' selected':'')) + (ms.wrongFlash && ms.wrongFlash.right===r.id ? ' shake':'');
    h += '<button class="'+cls+'" data-match-right="'+esc(r.id)+'" '+(locked?'disabled':'')+'>'+esc(r.text)+'</button>';
  });
  return h + '</div></div></div>';
}
function handleMatchClick(side, id){
  var ms = quizSession.matchState;
  if(ms.lockedIds.indexOf(id)>-1) return;
  ms.wrongFlash = null;
  if(side==='l') ms.selectedLeft = (ms.selectedLeft===id) ? null : id;
  else ms.selectedRight = (ms.selectedRight===id) ? null : id;
  if(ms.selectedLeft && ms.selectedRight){
    ms.attempts += 1;
    if(ms.selectedLeft === ms.selectedRight){
      ms.lockedIds.push(ms.selectedLeft);
      ms.selectedLeft = null; ms.selectedRight = null;
      rerender();
    } else {
      ms.wrongFlash = {left:ms.selectedLeft, right:ms.selectedRight};
      rerender();
      setTimeout(function(){
        if(quizSession && quizSession.matchState && state.view.name==='quiz'){
          var m = quizSession.matchState;
          m.selectedLeft = null; m.selectedRight = null; m.wrongFlash = null;
          rerender();
        }
      }, 500);
    }
  } else {
    rerender();
  }
}

function quizSummary(){
  var qs = quizSession;
  var isMatch = qs.type==='match';
  var total = isMatch ? qs.matchState.attempts : qs.items.length;
  var score = isMatch ? qs.items.length : qs.score;
  var h = '<div class="eyebrow">'+esc(t('quiz.done'))+'</div><div class="quiz-shell quiz-summary">';
  h += '<div class="score">'+score+' / '+total+'</div>';
  h += '<p style="margin-top:10px;">'+esc(isMatch ? t('quiz.allMatched',{n:qs.items.length, m:total}) : t('quiz.niceWork'))+'</p>';
  h += '<div style="display:flex; gap:10px; justify-content:center; margin-top:18px;">';
  h += '<button class="btn" data-action="quiz-again">'+esc(t('quiz.again'))+'</button>';
  h += '<button class="btn secondary" data-action="back-practice">'+esc(t('quiz.choose'))+'</button>';
  h += '</div></div>';
  if(!qs._recorded){
    recordProgress(qs.lessonId, qs.type, score, total);
    qs._recorded = true;
  }
  return h;
}

  on(mount,'[data-action="record-all"]', function(b){ b.addEventListener('click', function(){ openRecordModal(b.getAttribute('data-cat'), null); }); });

  /* backup & content pack */
  var pe = document.getElementById('packExport');

    buildPack().then(function(pack){
      downloadText('jinghpaw-ga-content-pack.json', JSON.stringify(pack));

  });
  var pib = document.getElementById('packImportBtn'), pif = document.getElementById('packImport');
  if(pib && pif){
    pib.addEventListener('click', function(){ pif.click(); });
    pif.addEventListener('change', function(){
      var f = pif.files[0]; if(!f) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{

          if(!packValid(pack)){ showToast("That isn't a Jinghpaw ga content pack."); return; }
          var words = 0; pack.content.forEach(function(c){ words += (c.items||[]).length; });
          openImportModal({pack:pack, words:words, recordings:Object.keys(pack.audio||{}).length, ui:Object.keys(pack.ui||{}).length});
        }catch(e){ showToast("That file couldn't be read."); }
      };
      reader.readAsText(f);
    });

  /* interface text editor */
  if(state.view.name==='translate'){

        };
        reader.readAsText(f);
      });
    }
  }
}

/* ---------- microphone recording ---------- */
var rec = {stream:null, mr:null, chunks:[], timer:null, t0:0, cancelled:false};
function micAvailable(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder!=='undefined');
}
function stopRec(){ if(rec.mr && rec.mr.state!=='inactive') rec.mr.stop(); }
function cancelRec(){
  rec.cancelled = true;
  stopRec();
  if(rec.stream) rec.stream.getTracks().forEach(function(t){ t.stop(); });
  clearInterval(rec.timer);
}
function startRec(onDone, onTick){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr = new MediaRecorder(stream);
    rec.stream = stream; rec.mr = mr; rec.chunks = []; rec.t0 = Date.now(); rec.cancelled = false;
    mr.ondataavailable = function(e){ if(e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(rec.timer);
      rec.mr = null;
      if(rec.cancelled) return;
      var blob = new Blob(rec.chunks, {type: mr.mimeType || 'audio/webm'});
      readFileAsDataURL(blob).then(onDone);
    };
    mr.start();
    rec.timer = setInterval(function(){
      var sec = (Date.now() - rec.t0) / 1000;
      onTick(sec);
      if(sec >= 15) stopRec();
    }, 200);
    onTick(0);
  }).catch(function(){
    showToast("Couldn't use the microphone. Check that it is allowed, or choose a file instead.");
    onTick(-1);
  });
}
function recTick(btnId, timeId){
  return function(sec){
    var b = document.getElementById(btnId), tm = document.getElementById(timeId);
    if(!b) return;
    if(sec < 0){ b.textContent = '● Record'; b.classList.remove('live'); if(tm) tm.textContent = ''; return; }
    b.textContent = '■ Stop'; b.classList.add('live');
    if(tm) tm.textContent = sec.toFixed(1) + ' s';
  };
}
function toggleRec(btnId, timeId, onDone){
  if(rec.mr && rec.mr.state==='recording'){ stopRec(); return; }
  if(!micAvailable()){ showToast("Recording isn't available in this window — choose a file instead."); return; }
  startRec(onDone, recTick(btnId, timeId));
}

/* ---------- modals ---------- */
function audioLabel(){ return learningEn() ? 'English pronunciation (your voice)' : 'Jinghpaw pronunciation (optional)'; }

function openWordModal(catId, itemId){
  var cat = catById(catId);
  var item = itemId ? cat.items.filter(function(i){ return i.id===itemId; })[0] : null;
  var noteField = learningEn() ? 'noteEn' : 'note';
  state.modal = {
    kind:'word', catId:catId, itemId:itemId, noteField:noteField,
    jp: item?item.jp:'', en: item?item.en:'', note: item&&item[noteField]?item[noteField]:'',
    hasAudio: item ? !!item[audioFlag()] : false,
    pendingAudioDataUrl:null, removeAudioFlag:false,
    newId: itemId ? null : uid('w')
  };
  renderModal();
}
function openDeleteModal(catId, itemId){
  var cat = catById(catId);
  var item = cat.items.filter(function(i){ return i.id===itemId; })[0];
  var label = item ? ((item.jp ? item.jp+' — ' : '') + item.en) : '';
  state.modal = {kind:'delete', catId:catId, itemId:itemId, label:label};
  renderModal();
}
function openRecordModal(catId, startItemId){
  var cat = catById(catId);
  var items = visibleItems(cat);
  if(!items.length) return;
  var start = 0;
  if(startItemId){
    items.forEach(function(it, i){ if(it.id===startItemId) start = i; });
  } else {
    for(var i=0; i<items.length; i++){ if(!audioOk(items[i])){ start = i; break; } }
  }
  state.modal = {kind:'record', catId:catId, queue:items.map(function(it){ return it.id; }), pos:start, pending:null};
  renderModal();
}
function openImportModal(info){ state.modal = {kind:'import', info:info}; renderModal(); }

function captureModalFields(){
  var m = state.modal;
  if(!m || m.kind!=='word') return;
  var a = document.getElementById('mJp'), b = document.getElementById('mEn'), c = document.getElementById('mNote');
  if(a) m.jp = a.value;
  if(b) m.en = b.value;
  if(c) m.note = c.value;
}
function closeModal(){
  var was = state.modal && state.modal.kind;
  cancelRec();
  state.modal = null;
  renderModal();
  if(was==='record') render();
}

function renderModal(){
  var existing = document.getElementById('modalHost');
  if(existing) existing.remove();
  if(!state.modal) return;
  var m = state.modal;
  var host = document.createElement('div');
  host.id = 'modalHost';
  var html = '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">';
  var recItem = null;

  if(m.kind==='word'){
    var cat = catById(m.catId);
    var enOnly = cat && cat.course==='en';
    html += '<h3>'+(m.itemId ? 'Edit word' : 'Add word')+'</h3>';
    html += '<div class="field"><label>Jinghpaw'+(enOnly?' (optional for now)':'')+'</label><input id="mJp" type="text" value="'+esc(m.jp)+'" placeholder="e.g. shat"></div>';
    html += '<div class="field"><label>English</label><input id="mEn" type="text" value="'+esc(m.en)+'" placeholder="e.g. rice / food"></div>';
    html += '<div class="field"><label>Note (optional)'+(learningEn()?' — shown in the English course':' — shown in the Jinghpaw course')+'</label><input id="mNote" type="text" value="'+esc(m.note)+'" placeholder="usage note, tone note, example word…"></div>';
    html += '<div class="field"><label>'+esc(audioLabel())+'</label>';
    if(m.hasAudio && !m.removeAudioFlag){
      html += '<div style="display:flex; gap:8px; margin-bottom:8px;"><button type="button" class="audio-btn" id="mPlayAudio">▶ Play current recording</button><button type="button" class="btn secondary small" id="mRemoveAudio">Remove</button></div>';
    }
    if(m.pendingAudioDataUrl){
      html += '<div style="margin-bottom:8px;"><button type="button" class="audio-btn" id="mPlayPending">▶ Play new recording</button> <span style="font-size:12.5px; color:var(--jade);">will save with this word</span></div>';
    }
    html += '<div class="rec-row"><button type="button" class="btn small rec-btn" id="mRec">● Record</button><span class="rec-time" id="mRecTime"></span></div>';
    html += '<div class="file-hint">or choose a recorded file: <input type="file" accept="audio/*" id="mAudioFile"></div>';
    html += '</div>';
    html += '<div class="modal-actions"><button class="btn secondary" id="modalCancel">Cancel</button><button class="btn" id="modalSave">Save</button></div>';
  } else if(m.kind==='delete'){
    html += '<h3>Delete word?</h3><p style="margin-top:6px; color:#5a4d42;">'+esc(m.label)+'</p>';
    html += '<div class="modal-actions"><button class="btn secondary" id="modalCancel">Cancel</button><button class="btn danger" id="modalDelete">Delete</button></div>';
  } else if(m.kind==='record'){
    var rc = catById(m.catId);
    recItem = rc.items.filter(function(i){ return i.id===m.queue[m.pos]; })[0];
    var more = m.pos < m.queue.length - 1;
    html += '<h3>Record pronunciation</h3>';
    html += '<div class="muted-strong">'+(m.pos+1)+' of '+m.queue.length+'</div>';
    html += '<div class="rec-word">'+esc(tgt(recItem))+'</div>';
    html += '<div class="rec-sub">'+esc(nat(recItem) || '')+'</div>';
    html += '<p class="file-hint" style="margin:0 0 10px 0;">'+(learningEn() ? 'Say the English word clearly, in your own voice.' : 'Say the Jinghpaw word clearly.')+'</p>';
    if(audioOk(recItem)) html += '<div style="margin-bottom:8px;"><button type="button" class="audio-btn" id="rPlayCur">▶ Play current recording</button></div>';
    html += '<div class="rec-row"><button type="button" class="btn rec-btn" id="rRec">● Record</button><span class="rec-time" id="rRecTime"></span></div>';
    if(m.pending) html += '<div style="margin:10px 0;"><button type="button" class="audio-btn" id="rPlayNew">▶ Play new recording</button> <span style="font-size:12.5px; color:var(--jade);">ready to save</span></div>';
    html += '<div class="modal-actions"><button class="btn secondary" id="modalCancel">Close</button><button class="btn secondary" id="rSkip">'+(more?'Skip':'Finish')+'</button><button class="btn" id="rSave"'+(m.pending?'':' disabled')+'>'+(more?'Save &amp; next':'Save')+'</button></div>';
  } else if(m.kind==='import'){

    var af = document.getElementById('mAudioFile');

      var f = af.files[0]; if(!f) return;
      if(f.size > 4.5*1024*1024){ showToast('That clip is a bit large — try something under ~4MB.'); return; }
      captureModalFields();
      readFileAsDataURL(f).then(function(d){ m.pendingAudioDataUrl = d; m.removeAudioFlag = false; renderModal(); });
    });
    var pa = document.getElementById('mPlayAudio');
    if(pa) pa.addEventListener('click', function(){ playAudioFor(m.itemId); });
    var pp = document.getElementById('mPlayPending');
    if(pp) pp.addEventListener('click', function(){ playSrc(m.pendingAudioDataUrl); });

      if(rec.mr && rec.mr.state==='recording'){ showToast('Stop the recording first.'); return; }
      var jp = document.getElementById('mJp').value.trim();
      var en = document.getElementById('mEn').value.trim();
      var note = document.getElementById('mNote').value.trim();
      var c = catById(m.catId);
      var needJp = !(c && c.course==='en');
      if(!en || (needJp && !jp)){ showToast(needJp ? 'Please fill in both the Jinghpaw word and its English meaning.' : 'Please fill in the English word.'); return; }
      var targetId = m.itemId || m.newId;
      var it;
      if(m.itemId){
        it = c.items.filter(function(i){ return i.id===m.itemId; })[0];
        it.jp = jp; it.en = en;
      } else {
        it = {id:targetId, jp:jp, en:en};
        if(c && c.course) it.course = c.course;
        c.items.push(it);
      }
      if(note) it[m.noteField] = note; else delete it[m.noteField];

      var flag = audioFlag();
      var step = Promise.resolve();
      if(m.pendingAudioDataUrl){
        step = setAudio(targetId, m.pendingAudioDataUrl).then(function(){ it[flag] = true; delete audioCache[audioKey(targetId)]; });
      } else if(m.removeAudioFlag){
        step = deleteAudio(targetId).then(function(){ it[flag] = false; delete audioCache[audioKey(targetId)]; });
      }
      step.then(function(){ return saveContent(state.categories); }).then(function(){
        showToast(m.itemId ? 'Word updated.' : 'Word added.');
        state.modal = null;
        render();
      });
    });
  } else if(m.kind==='delete'){

      var c = catById(m.catId);
      c.items = c.items.filter(function(i){ return i.id!==m.itemId; });

        delete audioCache['audio_'+m.itemId]; delete audioCache['audioEn_'+m.itemId];
        return saveContent(state.categories);
      }).then(function(){
        showToast('Word deleted.');
        state.modal = null;
        render();
      });

      m.pos += 1; m.pending = null;
      if(m.pos >= m.queue.length){ closeModal(); showToast('All done.'); }
      else renderModal();
    }
    document.getElementById('rRec').addEventListener('click', function(){
      toggleRec('rRec', 'rRecTime', function(d){ m.pending = d; renderModal(); });
    });
    var pc = document.getElementById('rPlayCur');
    if(pc) pc.addEventListener('click', function(){ playAudioFor(recItem.id); });
    var pn = document.getElementById('rPlayNew');
    if(pn) pn.addEventListener('click', function(){ playSrc(m.pending); });
    document.getElementById('rSkip').addEventListener('click', function(){ cancelRec(); nextWord(); });
    document.getElementById('rSave').addEventListener('click', function(){
      if(!m.pending) return;
      var flag = audioFlag();
      setAudio(recItem.id, m.pending).then(function(){
        recItem[flag] = true;
        delete audioCache[audioKey(recItem.id)];
        return saveContent(state.categories);
      }).then(function(){ showToast('Saved.'); nextWord(); });
    });
  } else if(m.kind==='import'){
    document.getElementById('mImport').addEventListener('click', function(){
      applyPack(m.info.pack).then(function(r){
        state.categories = r.categories; state.ui = r.ui; audioCache = {};
        return Promise.all([saveContent(state.categories), saveUi()]);
      }).then(function(){
        state.modal = null;
        showToast('Content pack imported.');
        goTo({name:'intro'});
      });
    });
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
Promise.all([loadContent(), sGet('progress', {}), sGet('settings', {mode:null}), sGet('ui_jp', {})]).then(function(res){
  state.categories = res[0];
  state.progress = res[1] || {};
  state.mode = (res[2] && (res[2].mode==='en2jp' || res[2].mode==='jp2en')) ? res[2].mode : null;
  state.ui = (starterUi && !EDITOR) ? starterUi : ((res[3] && Object.keys(res[3]).length) ? res[3] : (starterUi || {}));
  if(starterUi && (!EDITOR || !(res[3] && Object.keys(res[3]).length))) saveUi();
  state.loaded = true;
  render();
}).catch(function(){
  state.categories = seedCategories();
  state.loaded = true;
  render();
});

render();
})();

</script></body></html>
